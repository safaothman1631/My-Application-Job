<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ئۆفلاین - Offline</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      text-align: center;
      padding: 20px;
    }
    .container {
      max-width: 500px;
    }
    h1 {
      font-size: 4rem;
      margin: 0 0 20px 0;
    }
    h2 {
      font-size: 2rem;
      margin: 0 0 20px 0;
    }
    p {
      font-size: 1.2rem;
      opacity: 0.9;
      margin: 0 0 30px 0;
    }
    button {
      background: white;
      color: #667eea;
      border: none;
      padding: 15px 30px;
      font-size: 1rem;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📴</h1>
    <h2>هێڵی ئینتەرنێت نییە</h2>
    <p>تکایە هێڵی ئینتەرنێتەکەت بپشکنە و دووبارە هەوڵبدەرەوە</p>
    <button onclick="location.reload()">دووبارە هەوڵبدەرەوە</button>
  </div>
</body>
</html>
